name: Test release script

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/release.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script .github/scripts/test_release.py
